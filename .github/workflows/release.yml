name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Check that the tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $manifest = Get-Content src/Community.PowerToys.Run.Plugin.Claude/plugin.json -Raw | ConvertFrom-Json
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($manifest.Version -ne $tag) {
            throw "plugin.json is at $($manifest.Version) but the tag is $tag."
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: |
          dotnet restore NewChatForClaude.sln /p:Platform=x64
          dotnet test NewChatForClaude.sln -c Release /p:Platform=x64

      - name: Pack
        run: .\scripts\pack.ps1

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: artifacts/*

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts -File | ForEach-Object { $_.FullName }

          # Publishing from the GitHub web interface creates the tag, which starts this
          # workflow, so by the time it runs the release can already exist. Attach the
          # archives to it rather than failing on a second create.
          gh release view '${{ github.ref_name }}' *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload '${{ github.ref_name }}' $files --clobber
          }
          else {
            gh release create '${{ github.ref_name }}' $files --generate-notes --verify-tag
          }
